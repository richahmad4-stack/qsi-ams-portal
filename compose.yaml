services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${AMS_DB_NAME:-qsi_ams}
      MARIADB_USER: ${AMS_DB_USER:-qsi_ams}
      MARIADB_PASSWORD: ${AMS_DB_PASSWORD:?Set AMS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${AMS_DB_ROOT_PASSWORD:?Set AMS_DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CI_ENVIRONMENT: production
      app.baseURL: ${AMS_BASE_URL:-http://localhost:8088/}
      database.default.hostname: db
      database.default.database: ${AMS_DB_NAME:-qsi_ams}
      database.default.username: ${AMS_DB_USER:-qsi_ams}
      database.default.password: ${AMS_DB_PASSWORD:?Set AMS_DB_PASSWORD}
      database.default.DBDriver: MySQLi
      database.default.port: 3306
      AMS_RUN_MIGRATIONS: ${AMS_RUN_MIGRATIONS:-0}
    volumes:
      - writable_data:/var/www/html/writable
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$c=@file_get_contents(\"http://127.0.0.1/login\"); exit($$c===false?1:0);'"]
      interval: 15s
      timeout: 5s
      retries: 12

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      AMS_SITE_ADDRESS: ${AMS_SITE_ADDRESS:-http://localhost:8088}
    ports:
      - "${AMS_HTTP_PORT:-8088}:8088"
      - "${AMS_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  writable_data:
  caddy_data:
  caddy_config:
