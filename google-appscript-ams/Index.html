<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --ink: #17202a;
      --muted: #5b6675;
      --line: #d9dee7;
      --panel: #ffffff;
      --bg: #f5f7fa;
      --brand: #0f766e;
      --brand-2: #2563eb;
      --warn: #b45309;
      --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 Arial, sans-serif; color: var(--ink); background: var(--bg); }
    header { height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; }
    header strong { font-size: 17px; }
    header span { color: var(--muted); font-size: 12px; }
    .shell { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 58px); }
    nav { background: #fff; border-right: 1px solid var(--line); padding: 14px; }
    nav button { display: block; width: 100%; border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 6px; color: var(--ink); cursor: pointer; }
    nav button.active, nav button:hover { background: #e8f3f1; color: #0f514c; }
    main { padding: 22px; max-width: 1500px; width: 100%; }
    h1 { margin: 0 0 18px; font-size: 24px; }
    h2 { margin: 22px 0 10px; font-size: 17px; }
    .grid { display: grid; gap: 14px; }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    .metric { font-size: 28px; font-weight: 700; }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    input, select, textarea { width: 100%; border: 1px solid #c8d0db; border-radius: 6px; padding: 9px 10px; font: inherit; background: #fff; }
    textarea { min-height: 86px; resize: vertical; }
    button.primary, button.secondary, button.danger { border: 0; border-radius: 6px; padding: 9px 12px; cursor: pointer; font-weight: 600; }
    button.primary { background: var(--brand); color: #fff; }
    button.secondary { background: #e6edf7; color: #173153; }
    button.danger { background: #fee2e2; color: var(--bad); }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: #eef2f7; font-size: 12px; color: #394657; }
    tr:hover td { background: #fbfcfe; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #3730a3; font-size: 12px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
    .tabs button { border: 1px solid var(--line); background: #fff; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
    .tabs button.active { background: var(--brand-2); color: #fff; border-color: var(--brand-2); }
    .notice { background: #fff7ed; border: 1px solid #fed7aa; padding: 12px; border-radius: 8px; color: #7c2d12; }
    .split { display: grid; grid-template-columns: 360px 1fr; gap: 14px; }
    .hidden { display: none !important; }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      nav { display: flex; overflow: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      nav button { width: auto; white-space: nowrap; }
      .grid.cols-4, .grid.cols-2, .split { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div><strong>QSI AMS</strong> <span id="version"></span></div>
    <div><span id="user"></span></div>
  </header>
  <div class="shell">
    <nav id="nav"></nav>
    <main id="app"></main>
  </div>
  <script>
    const BOOTSTRAP = <?!= bootstrap ?>;
    const state = { page: 'dashboard', clientFile: null, clients: [], dashboard: null, finance: null, admin: null, cycle: null, cyclePreview: null, clause: null, ncrBuilder: null, tab: 'summary' };
    const pages = [
      ['dashboard', 'Dashboard'], ['cycle_builder', 'Cycle Builder'], ['clients', 'Clients'], ['workflow', 'Workflow'],
      ['clause_builder', 'Clause Builder'], ['ncr_builder', 'NCR Builder'],
      ['finance', 'Finance'], ['admin', 'Admin'], ['audit', 'Audit Trail']
    ];

    document.getElementById('version').textContent = BOOTSTRAP.app.version;
    document.getElementById('user').textContent = BOOTSTRAP.user.full_name || BOOTSTRAP.user.email || BOOTSTRAP.user.error || '';

    function can(module, action) {
      const p = BOOTSTRAP.user.permissions || {};
      return Boolean(p[module] && p[module].indexOf(action) !== -1);
    }

    function server(action, payload) {
      return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).dispatch(action, payload || {});
      });
    }

    function nav() {
      const el = document.getElementById('nav');
      el.innerHTML = '';
      pages.forEach(([id, label]) => {
        if (id === 'finance' && !can('finance', 'view')) return;
        if (id === 'cycle_builder' && !can('cycle_builder', 'view')) return;
        if (id === 'clause_builder' && !can('clause_builder', 'view')) return;
        if (id === 'ncr_builder' && !can('ncr_builder', 'view')) return;
        if (id === 'admin' && !can('users', 'view')) return;
        if (id === 'audit' && !can('audit_trail', 'view')) return;
        const b = document.createElement('button');
        b.textContent = label;
        b.className = state.page === id ? 'active' : '';
        b.onclick = () => show(id);
        el.appendChild(b);
      });
    }

    async function show(page) {
      state.page = page;
      nav();
      renderLoading(page);
      try {
        if (BOOTSTRAP.user.error) return renderError(BOOTSTRAP.user.error);
        if (page === 'dashboard') {
          state.dashboard = await server('dashboard');
          renderDashboard();
        }
        if (page === 'clients') {
          state.clients = await server('listClients', {});
          renderClients();
        }
        if (page === 'workflow') {
          state.clients = await server('listClients', {});
          renderWorkflow();
        }
        if (page === 'cycle_builder') {
          state.cycle = await server('cycleBuilder');
          renderCycleBuilder();
        }
        if (page === 'finance') {
          state.finance = await server('finance');
          renderFinance();
        }
        if (page === 'clause_builder') {
          state.clause = await server('clauseBuilder');
          renderClauseBuilder();
        }
        if (page === 'ncr_builder') {
          state.ncrBuilder = await server('ncrBuilder');
          renderNcrBuilder();
        }
        if (page === 'admin') {
          state.admin = await server('adminData');
          renderAdmin();
        }
        if (page === 'audit') {
          state.audit = await server('auditTrail', { limit: 200 });
          renderAudit();
        }
      } catch (err) {
        renderError(err.message || err);
      }
    }

    function renderLoading(page) {
      const titles = { dashboard: 'Dashboard', cycle_builder: 'Cycle Builder', clients: 'Clients', workflow: 'Certification Workflow', clause_builder: 'Clause Builder', ncr_builder: 'NCR Builder', finance: 'Finance', admin: 'Admin', audit: 'Audit Trail' };
      document.getElementById('app').innerHTML = `<h1>${html(titles[page] || 'QSI AMS')}</h1><div class="card muted">Loading...</div>`;
      if (page === 'dashboard') renderDashboard();
    }

    function html(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderError(message) {
      document.getElementById('app').innerHTML = '<div class="notice">' + html(message) + '</div><div class="card" style="margin-top:14px"><button class="primary" onclick="bootstrapSeed()">Seed baseline / create first admin</button></div>';
    }

    async function bootstrapSeed() {
      try {
        const res = await server('seedBaseline', {});
        alert(res.message + '. Reloading AMS.');
        location.reload();
      } catch (err) {
        alert(err.message || err);
      }
    }

    function renderDashboard() {
      const d = state.dashboard || { counts: { clients: 0, activeCertificates: 0, openNcrs: 0, pendingReviews: 0 }, upcoming: [], recent: [] };
      document.getElementById('app').innerHTML = `
        <h1>Dashboard</h1>
        <div class="grid cols-4">
          ${metric('Clients', d.counts.clients)}
          ${metric('Active certificates', d.counts.activeCertificates)}
          ${metric('Open NCRs', d.counts.openNcrs)}
          ${metric('Pending technical reviews', d.counts.pendingReviews)}
        </div>
        <h2>Upcoming Audits</h2>
        ${table(d.upcoming, ['company','event_type','audit_number','planned_start_date','status'])}
        <h2>Recent Activity</h2>
        ${table(d.recent, ['created_at','full_name','action','entity_table','entity_id'])}
      `;
    }

    function metric(label, value) {
      return `<div class="card"><div class="metric">${html(value)}</div><div class="muted">${html(label)}</div></div>`;
    }

    function table(rows, cols) {
      if (!rows || !rows.length) return '<div class="card muted">No records.</div>';
      return `<table><thead><tr>${cols.map(c => `<th>${html(c.replaceAll('_',' '))}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td>${html(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }

    function renderClients() {
      document.getElementById('app').innerHTML = `
        <div class="row"><h1 style="flex:1">Clients</h1><button class="secondary" onclick="seedDemoClient()">Seed demo client</button><button class="primary" onclick="newClient()">New client</button></div>
        ${table(state.clients, ['id','company','client_code','standards','current_stage','status','contact_email'])}
      `;
    }

    async function seedDemoClient() {
      document.getElementById('app').innerHTML = '<h1>Clients</h1><div class="card muted">Creating demo client...</div>';
      state.clientFile = await server('seedDemoClient', {});
      state.page = 'workflow';
      renderClientFile();
    }

    function newClient() {
      document.getElementById('app').innerHTML = `
        <h1>New Client</h1>
        <div class="card">
          ${clientForm({ country: 'Saudi Arabia', status: 'prospect', current_stage: 'application', number_of_sites: 1 })}
          <button class="primary" onclick="submitClient()">Save client</button>
        </div>`;
    }

    function clientForm(c) {
      return `
        <div class="grid cols-2">
          <div><label>Company</label><input id="company" value="${html(c.company)}"></div>
          <div><label>Client code</label><input id="client_code" value="${html(c.client_code)}"></div>
          <div><label>Legal name</label><input id="legal_name" value="${html(c.legal_name)}"></div>
          <div><label>Contact email</label><input id="contact_email" value="${html(c.contact_email)}"></div>
          <div><label>Contact name</label><input id="contact_name" value="${html(c.contact_name)}"></div>
          <div><label>Contact phone</label><input id="contact_phone" value="${html(c.contact_phone)}"></div>
          <div><label>Country</label><input id="country" value="${html(c.country)}"></div>
          <div><label>City</label><input id="city" value="${html(c.city)}"></div>
          <div><label>Employees</label><input id="employee_count" type="number" value="${html(c.employee_count)}"></div>
          <div><label>Sites</label><input id="number_of_sites" type="number" value="${html(c.number_of_sites)}"></div>
        </div>
        <label>Address</label><textarea id="address">${html(c.address)}</textarea>
        <label>Scope</label><textarea id="scope">${html(c.scope)}</textarea>
        <label>Standards</label>
        <div class="row">${BOOTSTRAP.standards.map(s => `<label style="font-weight:400"><input style="width:auto" type="checkbox" name="standards" value="${s.id}"> ${html(s.code)}</label>`).join('')}</div>
      `;
    }

    async function submitClient() {
      const standard_ids = Array.from(document.querySelectorAll('input[name=standards]:checked')).map(x => x.value);
      const payload = {
        company: val('company'), legal_name: val('legal_name'), client_code: val('client_code'),
        address: val('address'), city: val('city'), country: val('country'),
        contact_name: val('contact_name'), contact_email: val('contact_email'), contact_phone: val('contact_phone'),
        employee_count: val('employee_count'), number_of_sites: val('number_of_sites'), scope: val('scope'),
        status: 'prospect', current_stage: 'application', standard_ids
      };
      document.getElementById('app').innerHTML = '<h1>New Client</h1><div class="card muted">Saving client...</div>';
      const saved = await server('saveClient', payload);
      state.clientFile = saved && saved.client ? saved : await clientFileByCode(payload.client_code, payload.company);
      state.page = 'workflow';
      renderClientFile();
    }

    async function clientFileByCode(code, company) {
      const clients = await server('listClients', {});
      state.clients = clients || [];
      const match = state.clients.find(c => String(c.client_code) === String(code)) || state.clients.find(c => String(c.company) === String(company));
      if (!match) throw new Error('Client was saved but could not be reopened yet. Open Clients and refresh.');
      return server('clientFile', { clientId: Number(match.id) });
    }

    function val(id) { return document.getElementById(id).value; }

    function renderWorkflow() {
      document.getElementById('app').innerHTML = `
        <h1>Certification Workflow</h1>
        <div class="split">
          <div class="card">
            <label>Select client</label>
            <select id="clientPick">${state.clients.map(c => `<option value="${c.id}">${html(c.company)} - ${html(c.current_stage)}</option>`).join('')}</select>
            <button class="primary" style="margin-top:10px" onclick="loadClient()">Open file</button>
          </div>
          <div class="card muted">Open a client file to work through application, review, proposal, contract, audit, NCR/CAPA, technical review, decision and certificate issue.</div>
        </div>`;
    }

    async function loadClient() {
      state.clientFile = await server('clientFile', { clientId: Number(val('clientPick')) });
      renderClientFile();
    }

    function renderClientFile() {
      const f = state.clientFile;
      if (!f || !f.client) return renderError('Client file could not be opened. Open Clients and select the saved client again.');
      const c = f.client;
      document.getElementById('app').innerHTML = `
        <div class="row"><h1 style="flex:1">${html(c.company)}</h1><span class="pill">${html(c.current_stage)}</span><span class="pill">${html(c.status)}</span></div>
        <div class="muted">${html((f.standards || []).map(s => s.code).join(', '))}</div>
        <div class="tabs">${clientTabs().map(([id, label]) => `<button class="${state.tab === id ? 'active' : ''}" onclick="state.tab='${id}';renderClientFile()">${html(label)}</button>`).join('')}</div>
        <div id="fileTab">${tabHtml(f, state.tab)}</div>
      `;
    }

    function clientTabs() {
      return [
        ['summary','Summary'], ['client_master','Client Master'], ['sites_processes','Sites & Processes'],
        ['application','Application'], ['application_review','Application Review'], ['proposal','Proposal'],
        ['contract','Contract'], ['audit_program','Audit Program'], ['stage1','Stage 1'], ['stage2','Stage 2'],
        ['technical','Technical Review'], ['decision','Decision & GM'], ['certificate','Certificates'],
        ['surveillance1','Surveillance 1'], ['surveillance2','Surveillance 2'], ['recertification','Recertification'],
        ['ncr','NCR/CAPA'], ['clause_builder','Clause Builder'], ['ncr_builder','NCR Builder'],
        ['documents','Documents'], ['finance','Finance'], ['feedback','Feedback'], ['audit_log','Audit Log']
      ];
    }

    function tabHtml(f, tab) {
      if (tab === 'summary') return `
        <div class="grid cols-4">
          ${metric('Stage', f.client.current_stage)}
          ${metric('Events', f.events.length)}
          ${metric('Open NCRs', f.ncrs.filter(x => x.status !== 'closed').length)}
          ${metric('Certificates', f.certificates.length)}
        </div>
        <h2>File Snapshot</h2>
        ${table([{ application: statusOf(f.application), review: statusOf(f.review), proposal: statusOf(f.proposal), contract: statusOf(f.contract), technical_review: statusOf(f.technicalReview), decision: statusOf(f.decision) }], ['application','review','proposal','contract','technical_review','decision'])}
        <h2>Audit Events</h2>${table(f.events, ['id','event_type','audit_number','planned_start_date','actual_end_date','status'])}`;
      if (tab === 'client_master') return `<div class="card">${clientForm(f.client)}</div>`;
      if (tab === 'sites_processes') return `<div class="card muted">Sites and processes are part of the full parity schema. Current no-paid screen keeps master client scope here until dedicated site/process CRUD is implemented.</div><h2>Scope</h2><div class="card">${html(f.client.scope)}</div>`;
      if (tab === 'application') return workflowForm('Application', 'saveApplication', [
        ['received_date','date','Received date'], ['status','text','Status'], ['scope_notes','textarea','Scope notes'], ['haccp_plans','number','HACCP plans']
      ], { clientId: f.client.id, application: {} }) + '<h2>Current Application</h2>' + table(f.application ? [f.application] : [], ['application_number','received_date','status','submitted_at']);
      if (tab === 'application_review') return workflowForm('Application Review', 'saveApplicationReview', [
        ['review_date','date','Review date'], ['decision','text','Decision'], ['calculated_days','number','Calculated days'], ['review_notes','textarea','Review notes']
      ], { clientId: f.client.id, review: {} }) + '<h2>Current Review</h2>' + table(f.review ? [f.review] : [], ['review_date','calculated_days','decision','status']);
      if (tab === 'proposal') return workflowForm('Proposal', 'saveProposal', [
        ['proposal_number','text','Proposal number'], ['proposal_date','date','Proposal date'], ['valid_until','date','Valid until'], ['subtotal','number','Subtotal'], ['vat','number','VAT'], ['grand_total','number','Grand total'], ['status','text','Status']
      ], { clientId: f.client.id }) + '<h2>Proposal</h2>' + table(f.proposal ? [f.proposal] : [], ['proposal_number','proposal_date','valid_until','currency','grand_total','status']);
      if (tab === 'contract') return workflowForm('Contract', 'saveContract', [
        ['contract_number','text','Contract number'], ['signed_date','date','Signed date'], ['status','text','Status']
      ], { clientId: f.client.id }) + '<h2>Contract</h2>' + table(f.contract ? [f.contract] : [], ['contract_number','signed_date','status']);
      if (tab === 'audit_program') return auditProgramTab(f);
      if (tab === 'stage1') return stageTab(f, 'stage1', 'Stage 1');
      if (tab === 'stage2') return stageTab(f, 'stage2', 'Stage 2');
      if (tab === 'surveillance1') return stageTab(f, 'surveillance1', 'Surveillance 1');
      if (tab === 'surveillance2') return stageTab(f, 'surveillance2', 'Surveillance 2');
      if (tab === 'recertification') return stageTab(f, 'recertification', 'Recertification');
      if (tab === 'ncr') return ncrTab(f);
      if (tab === 'clause_builder') return clientClauseBuilderTab(f);
      if (tab === 'ncr_builder') return clientNcrBuilderTab(f);
      if (tab === 'technical') return workflowForm('Technical Review', 'saveTechnicalReview', [
        ['audit_event_id','number','Audit event ID'], ['review_date','date','Review date'], ['recommendation','text','Recommendation'], ['status','text','Status'], ['review_notes','textarea','Review notes']
      ], { clientId: f.client.id, checklist: {} }) + '<h2>Technical Review</h2>' + table(f.technicalReview ? [f.technicalReview] : [], ['id','audit_event_id','review_date','recommendation','status','review_notes']);
      if (tab === 'decision') return workflowForm('Decision', 'saveDecision', [
        ['technical_review_id','number','Technical review ID'], ['decision_date','date','Decision date'], ['decision','text','Decision'], ['gm_approval','text','GM approval'], ['status','text','Status'], ['decision_notes','textarea','Decision notes']
      ], { clientId: f.client.id }) + '<h2>Certification Decision</h2>' + table(f.decision ? [f.decision] : [], ['id','decision_date','decision','gm_approval','status','decision_notes']);
      if (tab === 'certificate') return workflowForm('Issue Certificate', 'issueCertificate', [
        ['certification_decision_id','number','Decision ID'], ['certificate_number','text','Certificate number'], ['standard_code','text','Standard'], ['issue_date','date','Issue date'], ['expiry_date','date','Expiry date'], ['scope','textarea','Scope']
      ], { clientId: f.client.id }) + table(f.certificates, ['certificate_number','standard_code','issue_date','expiry_date','status','verification_token']);
      if (tab === 'documents') return documentTab(f);
      if (tab === 'finance') return table(f.invoices, ['invoice_number','invoice_date','due_date','total','status']);
      if (tab === 'feedback') return '<div class="card muted">Feedback capture belongs in this client workflow tab and will feed F36 document generation in the full parity build.</div>';
      if (tab === 'audit_log') return '<div class="card muted">Open Audit Trail from the sidebar for tenant activity. Client-filtered audit log is planned for this tab.</div>';
      return '';
    }

    function statusOf(row) {
      return row ? (row.status || row.decision || row.recommendation || 'recorded') : 'missing';
    }

    function workflowForm(title, action, fields, base) {
      const id = 'f' + Math.random().toString(16).slice(2);
      setTimeout(() => { window[id] = { action, base }; }, 0);
      return `<div class="card" style="margin-bottom:14px"><h2>${html(title)}</h2>${fields.map(([name,type,label]) => type === 'textarea' ? `<label>${html(label)}</label><textarea data-form="${id}" data-name="${name}"></textarea>` : `<label>${html(label)}</label><input data-form="${id}" data-name="${name}" type="${type}">`).join('')}<button class="primary" style="margin-top:10px" onclick="submitWorkflow('${id}')">Save ${html(title)}</button></div>`;
    }

    async function submitWorkflow(id) {
      const info = window[id];
      const payload = Object.assign({}, info.base);
      document.querySelectorAll(`[data-form="${id}"]`).forEach(el => payload[el.dataset.name] = el.value);
      state.clientFile = await server(info.action, payload);
      renderClientFile();
    }

    function auditProgramTab(f) {
      return `
        ${workflowForm('Create Audit Program', 'createAuditProgram', [['program_number','text','Program number'],['cycle_type','text','Cycle type'],['start_date','date','Start date'],['expiry_date','date','Expiry date'],['status','text','Status']], { clientId: f.client.id })}
        ${workflowForm('Audit Event', 'saveAuditEvent', [['audit_program_id','number','Program ID'],['audit_number','text','Audit number'],['event_type','text','Event type'],['planned_start_date','date','Planned start'],['planned_end_date','date','Planned end'],['status','text','Status']], { clientId: f.client.id })}
        <h2>Audit Programmes</h2>${table(f.programs, ['id','program_number','cycle_type','start_date','expiry_date','status'])}
        <h2>Audit Events</h2>${table(f.events, ['id','audit_number','event_type','planned_start_date','actual_end_date','status'])}
      `;
    }

    function stageTab(f, eventType, label) {
      const event = (f.events || []).find(e => e.event_type === eventType) || {};
      const eventId = event.id || '';
      const plans = (f.plans || []).filter(p => String(p.audit_event_id) === String(eventId));
      const planIds = plans.map(p => String(p.id));
      const appointments = (f.appointments || []).filter(a => String(a.audit_event_id) === String(eventId));
      const items = (f.planItems || []).filter(i => planIds.indexOf(String(i.audit_plan_id)) !== -1);
      const responses = (f.responses || []).filter(r => String(r.audit_event_id) === String(eventId));
      const ncrs = (f.ncrs || []).filter(n => String(n.audit_event_id) === String(eventId));
      const ncrIds = ncrs.map(n => String(n.id));
      const capas = (f.capas || []).filter(c => String(c.audit_event_id) === String(eventId) || ncrIds.indexOf(String(c.ncr_id)) !== -1);
      const reports = (f.auditReports || []).filter(r => String(r.audit_event_id) === String(eventId));
      const lock = eventId ? '' : `<div class="notice">${html(label)} audit event is not created yet. Create it from Audit Program or Cycle Builder.</div>`;
      return `
        ${lock}
        <h2>${html(label)} File</h2>
        ${table(eventId ? [event] : [], ['id','audit_number','event_type','planned_start_date','planned_end_date','actual_end_date','status'])}
        ${eventId ? workflowForm(label + ' Appointment', 'saveAppointment', [['audit_event_id','number','Audit event ID'],['user_id','number','User ID'],['role_in_audit','text','Role'],['appointment_status','text','Status']], { clientId: f.client.id, audit_event_id: eventId }) : ''}
        ${eventId ? workflowForm(label + ' Audit Plan', 'saveAuditPlan', [['audit_event_id','number','Audit event ID'],['objective','textarea','Objective'],['criteria','textarea','Criteria'],['scope','textarea','Scope'],['status','text','Status']], { clientId: f.client.id, audit_event_id: eventId }) : ''}
        <h2>Appointment and Team</h2>${table(appointments, ['audit_event_id','role_in_audit','appointment_status','conflict_checked'])}
        <h2>Plan</h2>${table(plans, ['id','audit_event_id','status','objective','criteria'])}
        <h2>Timetable</h2>${table(items, ['audit_date','start_time','end_time','process_area','clause_reference','auditor_name'])}
        <h2>Requirement Checklist</h2>
        ${eventId ? requirementResponseForm(f, eventId) : ''}
        ${table(responses, ['id','requirement_code','title','conformity_status','auditor_confirmed','objective_evidence','finding_text'])}
        <h2>Audit Report</h2>${table(reports, ['report_number','stage_type','summary','conclusion','recommendation','status','submitted_at'])}
        <h2>NCR/CAPA For ${html(label)}</h2>${table(ncrs, ['id','ncr_number','severity','status','statement','due_date'])}${table(capas, ['id','ncr_id','status','action_plan','responsible_person','due_date'])}
      `;
    }

    function requirementResponseForm(f, eventId) {
      return `<div class="card"><label>Audit event ID</label><input id="rr_event" value="${html(eventId)}"><label>Requirement</label><select id="rr_req">${f.requirements.map(r => `<option value="${r.id}">${html(r.requirement_code)} - ${html(r.title)}</option>`).join('')}</select><label>Status</label><select id="rr_status"><option>conforming</option><option>minor_nc</option><option>major_nc</option><option>opportunity</option></select><label>Objective evidence</label><textarea id="rr_ev"></textarea><label>Finding</label><textarea id="rr_find"></textarea><label><input id="rr_confirm" type="checkbox" style="width:auto"> Auditor confirmed</label><button class="primary" onclick="saveResponse()">Save response</button></div>`;
    }

    async function saveResponse() {
      const f = state.clientFile;
      state.clientFile = await server('saveRequirementResponse', { clientId: f.client.id, audit_event_id: val('rr_event'), audit_requirement_id: val('rr_req'), conformity_status: val('rr_status'), objective_evidence: val('rr_ev'), finding_text: val('rr_find'), auditor_confirmed: document.getElementById('rr_confirm').checked });
      renderClientFile();
    }

    function ncrTab(f) {
      return `
        ${workflowForm('NCR', 'saveNcr', [['audit_event_id','number','Audit event ID'],['audit_requirement_response_id','number','Response ID'],['ncr_number','text','NCR number'],['clause_reference','text','Clause'],['severity','text','Severity'],['responsible_person','text','Responsible person'],['due_date','date','Due date'],['verification_method','textarea','Verification method'],['statement','textarea','Statement'],['correction','textarea','Correction'],['root_cause','textarea','Root cause'],['corrective_action','textarea','Corrective action']], { clientId: f.client.id })}
        ${workflowForm('CAPA', 'saveCapa', [['audit_event_id','number','Audit event ID'],['ncr_id','number','NCR ID'],['responsible_person','text','Responsible person'],['due_date','date','Due date'],['action_plan','textarea','Action plan'],['evidence_summary','textarea','Evidence'],['effectiveness_review','textarea','Effectiveness review']], { clientId: f.client.id })}
        <h2>NCRs</h2>${table(f.ncrs, ['id','ncr_number','audit_event_id','severity','status','statement','responsible_person','due_date'])}
        <h2>CAPAs</h2>${table(f.capas, ['id','ncr_id','audit_event_id','status','action_plan','responsible_person','due_date'])}`;
    }

    function clientClauseBuilderTab(f) {
      return `
        <div class="card">
          <h2>Controlled Requirements In This Client File</h2>
          <p class="muted">Clause Builder feeds this client's stage checklists, audit reports, and NCR Builder.</p>
        </div>
        ${table(f.requirements.map(r => Object.assign({}, r, { mapped_clauses: (f.requirementMappings || []).filter(m => String(m.audit_requirement_id) === String(r.id)).map(m => m.standard_code + ' ' + m.clause_reference).join(', ') })), ['id','requirement_code','title','category','stage_applicability','mapped_clauses','active'])}
      `;
    }

    function clientNcrBuilderTab(f) {
      const candidates = (f.responses || []).map(r => {
        const ncr = (f.ncrs || []).find(n => String(n.audit_requirement_response_id) === String(r.id));
        return Object.assign({}, r, { duplicate_ncr: ncr ? ncr.ncr_number : '' });
      }).filter(r => ['minor_nc','major_nc','nonconforming'].indexOf(String(r.conformity_status).toLowerCase()) !== -1 || String(r.finding_text || '').trim());
      return `
        <div class="card"><h2>NCR Builder</h2><p class="muted">Create linked NCR/CAPA packages from this client's audit responses.</p><label>Audit response</label><select id="ncr_resp">${candidates.map(r => `<option value="${r.id}">${html(r.audit_event_id)} - ${html(r.requirement_code)} - ${html(r.conformity_status)} ${r.duplicate_ncr ? '(NCR ' + html(r.duplicate_ncr) + ')' : ''}</option>`).join('')}</select><label>Severity</label><select id="ncr_sev"><option>minor</option><option>major</option></select><label>Responsible person</label><input id="ncr_owner" value="${html(f.client.contact_name)}"><button class="primary" style="margin-top:10px" onclick="buildClientNcrPackage()">Build NCR/CAPA Package</button></div>
        <h2>Candidate Responses</h2>${table(candidates, ['id','audit_event_id','requirement_code','conformity_status','finding_text','duplicate_ncr'])}
      `;
    }

    async function buildClientNcrPackage() {
      const f = state.clientFile;
      state.clientFile = await server('buildNcrPackage', { clientId: f.client.id, audit_requirement_response_id: val('ncr_resp'), severity: val('ncr_sev'), responsible_person: val('ncr_owner') });
      state.tab = 'ncr';
      renderClientFile();
    }

    function documentTab(f) {
      const templates = ['application_review','proposal','contract','audit_plan','audit_report','ncr_capa','technical_review','decision','certificate'];
      return `<div class="card"><label>Template</label><select id="tpl">${templates.map(t => `<option>${t}</option>`).join('')}</select><label>Notes / report body</label><textarea id="doc_notes"></textarea><button class="primary" onclick="genDoc()">Generate document</button></div><h2>Generated Documents</h2>${table(f.documents, ['template_key','title','generated_at','drive_file_id','pdf_file_id'])}<h2>Finance For This Client</h2>${table(f.invoices, ['invoice_number','invoice_date','due_date','total','status'])}`;
    }

    async function genDoc() {
      const f = state.clientFile;
      const res = await server('generateDocument', { clientId: f.client.id, template_key: val('tpl'), context: { notes: val('doc_notes'), report_body: val('doc_notes'), scope: f.client.scope } });
      alert('Generated document:\\n' + res.documentUrl + '\\n' + res.pdfUrl);
      state.clientFile = await server('clientFile', { clientId: f.client.id });
      renderClientFile();
    }

    function renderClauseBuilder() {
      const d = state.clause || { requirements: [], mappings: [], standards: [], runs: [] };
      document.getElementById('app').innerHTML = `
        <div class="row"><h1 style="flex:1">Clause Builder</h1><span class="pill">${html(d.requirements.length)} requirements</span></div>
        <div class="grid cols-2">
          <div class="card">
            <h2>Requirement</h2>
            <label>Requirement code</label><input id="cl_requirement_code" placeholder="QSI-COM-10.02">
            <label>Title</label><input id="cl_title">
            <label>Category</label><input id="cl_category" value="integrated_management">
            <label>Stage applicability</label><input id="cl_stage_applicability" value="all">
            <label>Audit question</label><textarea id="cl_audit_question"></textarea>
            <label>Evidence expectation</label><textarea id="cl_evidence_expectation"></textarea>
            <label>Source / basis note</label><input id="cl_source_note" value="QSI controlled clause builder">
            <label>Mappings, one per line: standard | clause | title | source</label>
            <textarea id="cl_mapping_lines" placeholder="ISO 22000:2018 | 8.9 | Control of product and process nonconformities | QSI controlled source"></textarea>
            <button class="primary" style="margin-top:10px" onclick="saveClauseRequirement()">Save Requirement</button>
          </div>
          <div>
            <h2>Recent Builder Runs</h2>${table(d.runs, ['created_at','action','requirement_id','summary'])}
          </div>
        </div>
        <h2>Controlled Requirement Catalogue</h2>
        ${table(d.requirements, ['id','requirement_code','title','category','stage_applicability','mapped_clauses','mapping_count','active'])}
        <h2>Clause Mappings</h2>
        ${table(d.mappings, ['audit_requirement_id','standard_code','clause_reference','clause_title','active'])}
      `;
    }

    async function saveClauseRequirement() {
      state.clause = await server('saveClauseRequirement', {
        requirement_code: val('cl_requirement_code'),
        title: val('cl_title'),
        category: val('cl_category'),
        stage_applicability: val('cl_stage_applicability'),
        audit_question: val('cl_audit_question'),
        evidence_expectation: val('cl_evidence_expectation'),
        source_note: val('cl_source_note'),
        mapping_lines: val('cl_mapping_lines')
      });
      renderClauseBuilder();
    }

    function renderNcrBuilder() {
      const d = state.ncrBuilder || { clients: [], candidates: [], ncrs: [], capas: [], runs: [] };
      document.getElementById('app').innerHTML = `
        <div class="row"><h1 style="flex:1">NCR Builder</h1><span class="pill">${html(d.candidates.length)} candidates</span></div>
        <div class="card">
          <label>Candidate audit response</label>
          <select id="nb_response">${d.candidates.map(r => `<option value="${r.id}">${html(r.company)} - ${html(r.event_type)} - ${html(r.requirement_code)} - ${html(r.conformity_status)} ${r.duplicate_ncr ? '(NCR ' + html(r.duplicate_ncr) + ')' : ''}</option>`).join('')}</select>
          <div class="grid cols-2">
            <div><label>Severity</label><select id="nb_severity"><option>minor</option><option>major</option></select></div>
            <div><label>Responsible person</label><input id="nb_responsible_person"></div>
          </div>
          <label>Optional NCR statement override</label><textarea id="nb_statement"></textarea>
          <button class="primary" style="margin-top:10px" onclick="buildNcrPackage()">Build NCR/CAPA Package</button>
        </div>
        <h2>Candidate Responses</h2>${table(d.candidates, ['id','company','event_type','requirement_code','conformity_status','clause_reference','finding_text','duplicate_ncr'])}
        <h2>NCRs</h2>${table(d.ncrs, ['id','ncr_number','event_type','severity','status','statement','responsible_person','due_date'])}
        <h2>CAPAs</h2>${table(d.capas, ['id','ncr_id','status','action_plan','responsible_person','due_date'])}
        <h2>Recent Builder Runs</h2>${table(d.runs, ['created_at','action','ncr_id','capa_id','summary'])}
      `;
    }

    async function buildNcrPackage() {
      state.ncrBuilder = await server('buildNcrPackage', {
        audit_requirement_response_id: val('nb_response'),
        severity: val('nb_severity'),
        responsible_person: val('nb_responsible_person'),
        statement: val('nb_statement')
      });
      renderNcrBuilder();
    }

    function renderCycleBuilder() {
      const d = state.cycle || { standards: [], runs: [], rows: [] };
      const p = state.cyclePreview;
      document.getElementById('app').innerHTML = `
        <div class="row"><h1 style="flex:1">Cycle Builder</h1><span class="pill">Super Admin</span></div>
        <div class="grid cols-2">
          <div class="card">
            <h2>Controlled Cycle Input</h2>
            <div class="grid cols-2">
              <div><label>Company</label><input id="cy_company" value="Demo Cycle Builder Client"></div>
              <div><label>Client code</label><input id="cy_client_code" value="CB-DEMO-001"></div>
              <div><label>Legal name</label><input id="cy_legal_name" value="Demo Cycle Builder Client LLC"></div>
              <div><label>City</label><input id="cy_city" value="Riyadh"></div>
              <div><label>Contact name</label><input id="cy_contact_name" value="Client Representative"></div>
              <div><label>Contact email</label><input id="cy_contact_email" value="cycle.client@example.com"></div>
              <div><label>Employees</label><input id="cy_employee_count" type="number" value="85"></div>
              <div><label>Sites</label><input id="cy_number_of_sites" type="number" value="1"></div>
              <div><label>Start date</label><input id="cy_start_date" type="date"></div>
              <div><label>Issue date</label><input id="cy_issue_date" type="date"></div>
              <div><label>Stage 1 days</label><input id="cy_stage1_days" type="number" value="1"></div>
              <div><label>Stage 2 days</label><input id="cy_stage2_days" type="number" value="2"></div>
            </div>
            <label>Scope</label><textarea id="cy_scope">Manufacturing and packing of chilled ready-to-eat food products.</textarea>
            <label>Standards</label>
            <div class="row">${d.standards.map(s => `<label style="font-weight:400"><input style="width:auto" type="checkbox" name="cy_standards" value="${html(s.code)}" ${['ISO 22000:2018','HACCP'].indexOf(String(s.code)) !== -1 ? 'checked' : ''}> ${html(s.code)}</label>`).join('')}</div>
            <div class="row" style="margin-top:12px">
              <label style="font-weight:400"><input style="width:auto" type="checkbox" id="cy_overwrite"> overwrite existing client code</label>
            </div>
            <button class="secondary" style="margin-top:10px" onclick="previewCycle()">Preview</button>
            <button class="primary" style="margin-top:10px" onclick="generateCycle()">Generate Complete Cycle</button>
          </div>
          <div>
            <h2>Preview</h2>${cyclePreviewHtml(p)}
          </div>
        </div>
        <h2>Cycle Builder Runs</h2>${table(d.runs, ['created_at','status','client_code','client_id','summary'])}
        <h2>Run Rows</h2>${table(d.rows, ['created_at','cycle_builder_run_id','client_code','status','message'])}
      `;
    }

    function cyclePayload() {
      return {
        company: val('cy_company'),
        legal_name: val('cy_legal_name'),
        client_code: val('cy_client_code'),
        city: val('cy_city'),
        contact_name: val('cy_contact_name'),
        contact_email: val('cy_contact_email'),
        employee_count: val('cy_employee_count'),
        number_of_sites: val('cy_number_of_sites'),
        start_date: val('cy_start_date'),
        issue_date: val('cy_issue_date'),
        stage1_days: val('cy_stage1_days'),
        stage2_days: val('cy_stage2_days'),
        scope: val('cy_scope'),
        overwrite_existing: document.getElementById('cy_overwrite').checked,
        standard_codes: Array.from(document.querySelectorAll('input[name=cy_standards]:checked')).map(x => x.value)
      };
    }

    function cyclePreviewHtml(p) {
      if (!p) return '<div class="card muted">Preview shows validation, duplicate warnings, records and audit stage files before saving.</div>';
      return `
        ${p.errors && p.errors.length ? `<div class="notice"><b>Errors</b><br>${p.errors.map(html).join('<br>')}</div>` : ''}
        ${p.warnings && p.warnings.length ? `<div class="notice"><b>Warnings</b><br>${p.warnings.map(html).join('<br>')}</div>` : ''}
        ${table([p.client], ['company','client_code','standards','issue_date','expiry_date'])}
        <h2>Records To Create</h2><div class="card">${(p.records || []).map(x => `<span class="pill" style="margin:3px">${html(x)}</span>`).join('')}</div>
        <h2>Audit Stage Files</h2>${table(p.events, ['audit_number','label','start_date','end_date','days','status'])}
      `;
    }

    async function previewCycle() {
      state.cyclePreview = await server('previewCycle', cyclePayload());
      renderCycleBuilder();
    }

    async function generateCycle() {
      const payload = cyclePayload();
      state.cyclePreview = await server('previewCycle', payload);
      if (state.cyclePreview.errors && state.cyclePreview.errors.length) return renderCycleBuilder();
      state.clientFile = await server('generateCycle', payload);
      state.tab = 'summary';
      state.page = 'workflow';
      renderClientFile();
    }

    function renderFinance() {
      document.getElementById('app').innerHTML = `
        <h1>Finance</h1>
        <div class="card">${workflowFields('inv', [['clientId','number','Client ID'],['invoice_number','text','Invoice number'],['invoice_date','date','Invoice date'],['due_date','date','Due date'],['subtotal','number','Subtotal'],['vat','number','VAT'],['total','number','Total'],['status','text','Status']])}<button class="primary" onclick="saveInvoice()">Save invoice</button></div>
        <h2>Invoices</h2>${table(state.finance.invoices, ['id','company','invoice_number','invoice_date','total','status'])}
        <h2>Payments</h2>${table(state.finance.payments, ['id','company','invoice_number','payment_date','amount','method','status'])}
      `;
    }

    function workflowFields(prefix, fields) {
      return fields.map(([name,type,label]) => `<label>${html(label)}</label><input id="${prefix}_${name}" type="${type}">`).join('');
    }

    async function saveInvoice() {
      const p = {};
      ['clientId','invoice_number','invoice_date','due_date','subtotal','vat','total','status'].forEach(k => p[k] = val('inv_' + k));
      state.finance = await server('saveInvoice', p);
      renderFinance();
    }

    function renderAdmin() {
      document.getElementById('app').innerHTML = `
        <div class="row"><h1 style="flex:1">Admin</h1><button class="secondary" onclick="seed()">Seed baseline</button></div>
        <div class="card">${workflowFields('user', [['full_name','text','Full name'],['email','text','Email'],['phone','text','Phone']])}<label>Role</label><select id="user_primary_role_code">${BOOTSTRAP.roleOptions.map(r => `<option value="${r.code}">${html(r.name)}</option>`).join('')}</select><label>Status</label><input id="user_status" value="active"><button class="primary" style="margin-top:10px" onclick="saveUser()">Save user</button></div>
        <h2>Users</h2>${table(state.admin.users, ['id','full_name','email','primary_role_code','status','last_login_at'])}
      `;
    }

    async function seed() {
      const res = await server('seedBaseline', {});
      alert(res.message);
    }

    async function saveUser() {
      const p = {};
      ['full_name','email','phone','primary_role_code','status'].forEach(k => p[k] = val('user_' + k));
      state.admin = await server('saveUser', p);
      renderAdmin();
    }

    function renderAudit() {
      document.getElementById('app').innerHTML = `<h1>Audit Trail</h1>${table(state.audit, ['created_at','full_name','action','entity_table','entity_id','after_json'])}`;
    }

    nav();
    show('dashboard');
  </script>
</body>
</html>
